name: transcription-deploy
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: transcription
      POSTGRES_DB: transcription_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U transcription -d transcription_db"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://transcription:${POSTGRES_PASSWORD}@db:5432/transcription_db
      DEBUG: "false"
      APP_ENV: production
      COOKIE_SECURE: "false"
      AUDIO_STORAGE_DIR: /data/audio
    volumes:
      - audio:/data/audio
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  web:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env.docker}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  database:
  audio:
