name: transcription-production
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: transcription
      POSTGRES_DB: transcription_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U transcription -d transcription_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://transcription:${POSTGRES_PASSWORD}@db:5432/transcription_db
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEBUG: "false"
      APP_ENV: production
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      AUDIO_STORAGE_DIR: /data/audio
    volumes:
      - audio:/data/audio
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
volumes:
  database:
  audio:
  certificates:
  caddy_config:
