services:
    postgres:
        image: postgres:17
        container_name: transcription_postgres
        restart: unless-stopped

        environment:
            POSTGRES_USER: transcription
            POSTGRES_PASSWORD: transcription
            POSTGRES_DB: transcription_db

        ports:
            - "5433:5432"

        volumes:
            - postgres_data:/var/lib/postgresql/data

        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U transcription -d transcription_db"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
